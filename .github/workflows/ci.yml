name: CI
on: [push, pull_request]

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: LibGMKit/Bridge/go.mod }
      - name: Go bridge tests
        working-directory: LibGMKit/Bridge
        run: go vet ./... && go test -race ./...
      - name: Build bridge xcframework
        run: LibGMKit/Bridge/build-xcframework.sh
      - name: LibGMKit tests
        working-directory: LibGMKit
        run: swift test
      - name: App package tests
        working-directory: app
        run: swift test
      - name: UI tests
        working-directory: app
        run: |
          brew install xcodegen
          xcodegen
          xcodebuild test -project Relay.xcodeproj -scheme Relay -destination 'platform=macOS'
