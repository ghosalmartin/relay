# XcodeGen spec: `brew install xcodegen && xcodegen` generates Relay.xcodeproj.
name: Relay
options:
  bundleIdPrefix: dev.featurenotabug
  deploymentTarget:
    macOS: "14.0"
packages:
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf
    from: 1.28.0
targets:
  RelayKit:
    type: framework
    platform: macOS
    sources: [Sources/RelayKit]
    dependencies:
      - framework: ../bridge/build/GMBridge.xcframework
        embed: false
      - package: SwiftProtobuf
      - sdk: libresolv.tbd
  Relay:
    type: application
    platform: macOS
    sources: [Sources/Relay]
    dependencies:
      - target: RelayKit
    settings:
      base:
        PRODUCT_NAME: Relay
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        GENERATE_INFOPLIST_FILE: YES
    entitlements:
      path: Sources/Relay/Relay.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
